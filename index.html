<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<title>单词冲刺 · Unit 1–2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{
  --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#8b8b90;
  --bg:#f5f5f7; --card:rgba(255,255,255,.86); --card-solid:#fff;
  --stroke:rgba(0,0,0,.07); --outline:rgba(0,0,0,.06);
  --well:rgba(120,120,128,.11); --well2:rgba(120,120,128,.18);
  --divider:rgba(60,60,67,.13);
  --accent:#007aff; --accent-d:#0063d1;
  --no:#d70015; --ok:#0e8a3e;
  --nobg:rgba(255,59,48,.13);
  --l4:#0071e3; --l4bg:rgba(0,122,255,.11);
  --l6:#b35c00; --l6bg:rgba(255,149,0,.14);
  --ac:#8e44c9; --acbg:rgba(175,82,222,.12);
  --inset:rgba(255,255,255,.9);
  --shadow:0 8px 28px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --fg:#f5f5f7; --fg2:rgba(235,235,245,.76); --fg3:rgba(235,235,245,.52);
    --bg:#000; --card:rgba(28,28,30,.80); --card-solid:#1c1c1e;
    --stroke:rgba(255,255,255,.09); --outline:rgba(255,255,255,.08);
    --well:rgba(120,120,128,.22); --well2:rgba(120,120,128,.32);
    --divider:rgba(240,240,245,.13);
    --accent:#0a84ff; --accent-d:#409cff;
    --no:#ff6961; --ok:#31d158;
    --nobg:rgba(255,69,58,.18);
    --l4:#6cb2ff; --l4bg:rgba(10,132,255,.17);
    --l6:#ffb340; --l6bg:rgba(255,159,10,.17);
    --ac:#d98cf7; --acbg:rgba(191,90,242,.16);
    --inset:rgba(255,255,255,.07);
    --shadow:0 10px 34px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  }
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--bg); color:var(--fg); overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none; touch-action:manipulation;
  transition:background .3s;
}
body::before{
  content:''; position:fixed; inset:-25%; z-index:0; pointer-events:none;
  background:
    radial-gradient(38% 32% at 18% 8%, rgba(0,122,255,.13), transparent 70%),
    radial-gradient(34% 28% at 88% 88%, rgba(255,59,48,.09), transparent 70%),
    radial-gradient(30% 26% at 70% 20%, rgba(175,82,222,.08), transparent 70%);
  filter:blur(36px);
}
@media (prefers-color-scheme:dark){ body::before{opacity:.55} }

.app{position:relative;z-index:1;height:100dvh;max-width:620px;margin:0 auto;display:flex;flex-direction:column;padding:0 18px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(22px,env(safe-area-inset-bottom))}
.view{display:flex;flex-direction:column;flex:1;min-height:0;animation:fadeIn .2s ease}
.view[hidden]{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 首页 ===== */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 2px 0}
.hd h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.hd .sub{margin:4px 0 0;font-size:12.5px;color:var(--fg2)}
.icon{width:38px;height:38px;border:none;background:var(--well);color:var(--fg2);border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.icon:hover{background:var(--well2)}

.hero{display:flex;align-items:center;gap:20px;margin:22px 0 18px;padding:18px 20px;border-radius:20px;background:var(--card);border:.5px solid var(--stroke);box-shadow:var(--shadow);backdrop-filter:blur(20px)}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:var(--well2)}
.ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .5s cubic-bezier(.3,.8,.3,1)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;letter-spacing:-.02em}
.hero-txt{min-width:0}
.hero-txt .big{font-size:17px;font-weight:650;letter-spacing:-.01em}
.hero-txt .sm{font-size:12.5px;color:var(--fg2);margin-top:5px;line-height:1.5}
.hero-txt .sm b{color:var(--fg);font-weight:600}

.cta{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.btn{border:none;font-family:inherit;font-weight:600;cursor:pointer;border-radius:14px;transition:transform .08s,filter .15s,background .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.985)}
.btn-primary{height:56px;background:var(--accent);color:#fff;font-size:17px;letter-spacing:.01em;box-shadow:0 4px 16px rgba(0,122,255,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{background:var(--well2);color:var(--fg3);box-shadow:none;cursor:default}
.btn-ghost{height:46px;background:var(--well);color:var(--fg);font-size:14.5px}
.btn-ghost:hover{background:var(--well2)}
.btn-ghost:disabled{color:var(--fg3);cursor:default}
.btn .n{font-weight:500;opacity:.75;font-size:14px}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 9px}
.sec h2{margin:0;font-size:13px;font-weight:650;color:var(--fg2);letter-spacing:.02em}
.sec span{font-size:11.5px;color:var(--fg3)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto;padding-bottom:6px}
.cell{position:relative;border:.5px solid var(--stroke);background:var(--card);border-radius:13px;padding:10px 8px 9px;cursor:pointer;text-align:center;transition:transform .1s,background .15s;overflow:hidden}
.cell:hover{background:var(--card-solid)}
.cell:active{transform:scale(.97)}
.cell .cn{font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.cell .cn .sep{color:var(--fg3);margin:0 1px;font-weight:500}
.cell .pg{font-size:10.5px;color:var(--fg3);margin-top:3px;font-variant-numeric:tabular-nums}
.cell .bar{position:absolute;left:0;bottom:0;height:2.5px;background:var(--accent);opacity:.75;transition:width .3s}
.cell.done{background:var(--l4bg);border-color:transparent}
.cell.done .pg{color:var(--l4)}

.foot-tip{margin-top:auto;padding:14px 2px 2px;font-size:11px;color:var(--fg3);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
@media (pointer:coarse){ .foot-tip{display:none} }
.kbd{display:inline-block;min-width:17px;padding:1px 5px;border-radius:5px;background:var(--well);color:var(--fg2);font-size:10px;font-weight:600;text-align:center;margin-right:3px}

/* ===== 学习页 ===== */
.study-bar{display:flex;align-items:center;gap:12px;padding:2px 2px 0}
.study-bar .close{width:30px;height:30px;border-radius:50%;background:var(--well);border:none;color:var(--fg2);font-size:15px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.study-bar .close:hover{background:var(--well2)}
.pbar{flex:1;height:5px;border-radius:99px;background:var(--well2);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;min-width:0;background:var(--accent);border-radius:99px;transition:width .25s ease}
.pbar>i.on{min-width:5px}
.study-bar .cnt{font-size:12.5px;color:var(--fg2);font-variant-numeric:tabular-nums;flex:none;letter-spacing:.01em}
.study-bar .cnt b{color:var(--fg);font-weight:650}

.card{flex:1;min-height:0;margin:16px 0 14px;border-radius:22px;background:var(--card);border:.5px solid var(--stroke);box-shadow:var(--shadow),inset 0 .5px 0 var(--inset);backdrop-filter:blur(24px);padding:26px 24px;display:flex;cursor:pointer;position:relative;overflow:hidden}
.face{width:100%;display:flex;flex-direction:column;animation:fadeUp .18s ease both;min-height:0}
.face.front{align-items:center;justify-content:center;text-align:center;gap:0}
.face.back{overflow-y:auto;padding-right:2px;padding-top:16px}
.face[hidden]{display:none!important}

.chip{position:absolute;top:16px;right:18px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
.chip.l4{background:var(--l4bg);color:var(--l4)}
.chip.l6{background:var(--l6bg);color:var(--l6)}
.chip.ac{background:var(--acbg);color:var(--ac)}

.word{font-size:clamp(2.3rem,9.2vw,3.55rem);font-weight:640;letter-spacing:-.035em;line-height:1.06;overflow-wrap:anywhere;max-width:100%;color:var(--fg)}
.ipa{margin-top:13px;font-size:clamp(.9rem,3.4vw,1.05rem);color:var(--fg2);letter-spacing:.01em;font-weight:400}
.tap-hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:13px;color:var(--fg2);font-weight:450;animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}

.bw{font-size:clamp(1.6rem,5.6vw,2.05rem);font-weight:650;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere;padding-right:44px}
.bp{font-size:12.5px;color:var(--fg2);margin-top:7px}
.spk{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;border:none;background:var(--well);color:var(--fg2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.spk:hover{background:var(--well2)}
.spk svg{width:14px;height:14px}
.rule{height:.5px;background:var(--divider);margin:16px 0}
.zrow{display:flex;gap:11px;align-items:flex-start}
.pos{font-size:12px;font-weight:600;color:var(--fg3);font-style:italic;padding-top:.42em;flex:none;min-width:30px}
.z{font-size:clamp(1.32rem,4.7vw,1.62rem);font-weight:600;letter-spacing:-.01em;line-height:1.32;color:var(--fg)}
.e{margin-top:12px;font-size:13.5px;line-height:1.6;color:var(--fg2)}
.ex{margin-top:16px;font-size:13px;line-height:1.62;color:var(--fg2);border-left:2.5px solid var(--divider);padding-left:12px}
.ex .en{color:var(--fg);opacity:.92}
.ex .zh{color:var(--fg2);opacity:.85;font-size:12.5px;margin-top:3px}
.badge-ok,.badge-no{position:absolute;inset:0;pointer-events:none;border-radius:22px;animation:flash .35s ease-out both}
.badge-ok{box-shadow:inset 0 0 0 2.5px var(--ok)}
.badge-no{box-shadow:inset 0 0 0 2.5px var(--no)}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

.acts{display:flex;gap:10px;flex:none}
.acts .btn{flex:1;height:56px;font-size:16.5px}
.btn-no{background:var(--nobg,rgba(255,59,48,.11));color:var(--no);box-shadow:inset 0 0 0 1.5px rgba(215,0,21,.30)}
.btn-no:hover{background:rgba(255,59,48,.18)}
.btn-yes{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.24)}
.btn-yes:hover{filter:brightness(1.06)}
.btn-next{background:var(--accent);color:#fff}

/* ===== 结算页 ===== */
.done-hd{text-align:center;padding:26px 0 6px}
.big-ring{width:104px;height:104px;margin:0 auto 16px;position:relative}
.big-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;letter-spacing:-.03em}
.done-hd h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.done-hd p{margin:7px 0 0;font-size:13px;color:var(--fg2)}
.done-hd p b{color:var(--fg);font-weight:650}
.weak{border:.5px solid var(--stroke);background:var(--card);border-radius:16px;margin:18px 0 14px;overflow:hidden;display:flex;flex-direction:column;min-height:0;flex:1}
.weak-hd{padding:11px 14px 9px;font-size:12px;font-weight:650;color:var(--fg2);border-bottom:.5px solid var(--divider);display:flex;justify-content:space-between;align-items:center}
.weak-list{overflow-y:auto;flex:1;min-height:0}
.wi{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:.5px solid var(--divider);cursor:pointer}
.wi:last-child{border-bottom:none}
.wi:hover{background:var(--well)}
.wi .ww{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:none}
.wi .wz{font-size:12.5px;color:var(--fg2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weak-empty{padding:30px 14px;text-align:center;font-size:13px;color:var(--fg2)}


/* ===== 续传 / 撤销 / 课文标签 ===== */
.btn-resume{height:54px;background:rgba(0,122,255,.11);color:var(--accent);font-size:15.5px;box-shadow:inset 0 0 0 1.5px rgba(0,122,255,.22)}
.btn-resume:hover{background:rgba(0,122,255,.17)}
.btn-resume .n{font-weight:500;opacity:.8;font-size:13.5px}

.chap{position:absolute;top:17px;left:19px;font-size:11.5px;font-weight:600;color:var(--fg3);letter-spacing:.03em}

.ipa-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px}
.ipa-row .ipa{margin-top:0}
.spk-mini{width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:var(--fg3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s,color .15s}
.spk-mini:hover{background:var(--well);color:var(--fg2)}
.spk-mini svg{width:13px;height:13px}

.btn-undo{width:56px;height:56px;flex:none;border-radius:14px;border:none;background:var(--well);color:var(--fg2);font-size:20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s}
.btn-undo:hover{background:var(--well2)}
.btn-undo:disabled{opacity:.35;cursor:default}
.btn[hidden],.btn-undo[hidden]{display:none!important}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(30,30,32,.92);color:#fff;font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;z-index:40;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 存储警告条 */
.warnbar{display:none;margin:12px 0 0;padding:10px 13px;border-radius:12px;background:rgba(255,149,0,.13);color:#b35c00;font-size:12.5px;line-height:1.5}
.warnbar.show{display:block}
@media (prefers-color-scheme:dark){ .warnbar{color:#ffb340} }

/* 深色模式下续传按钮 */
@media (prefers-color-scheme:dark){
  .btn-resume{background:rgba(10,132,255,.20);box-shadow:inset 0 0 0 1.5px rgba(10,132,255,.34)}
}

/* 设置面板 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .16s}
.mask[hidden]{display:none!important}
.sheet{width:100%;max-width:620px;background:var(--card-solid);border-radius:20px 20px 0 0;padding:8px 18px max(22px,env(safe-area-inset-bottom));animation:slideUp .22s cubic-bezier(.3,.9,.3,1);box-shadow:0 -8px 30px rgba(0,0,0,.14)}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:36px;height:5px;border-radius:99px;background:var(--well2);margin:6px auto 14px}
.sheet h3{margin:0 0 14px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.opt{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:.5px solid var(--divider)}
.opt:last-of-type{border-bottom:none}
.opt .lbl{font-size:14.5px}
.opt .lbl small{display:block;font-size:11.5px;color:var(--fg3);margin-top:3px}
.sw{width:48px;height:29px;border-radius:99px;background:var(--well2);border:none;position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .2s cubic-bezier(.3,.9,.3,1)}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(19px)}
.sheet .danger{margin-top:16px;width:100%;height:44px;border-radius:12px;border:none;background:rgba(255,59,48,.1);color:#ff3b30;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.sheet .ver{text-align:center;font-size:10.5px;color:var(--fg3);margin-top:14px}
</style>
</head>
<body>
<div class="app">

  <!-- ================= 首页 ================= -->
  <section class="view" id="vHome">
    <div class="hd">
      <div>
        <h1>单词冲刺</h1>
        <p class="sub" id="homeSub">读写教程 · Unit 1–2</p>
      </div>
      <button class="icon" id="btnGear" title="设置" aria-label="设置">⚙</button>
    </div>

    <div class="warnbar" id="warnbar"></div>

    <div class="hero">
      <div class="ring">
        <svg viewBox="0 0 100 100">
          <circle class="bgc" cx="50" cy="50" r="43"></circle>
          <circle class="fgc" id="ringFg" cx="50" cy="50" r="43" stroke-dasharray="270.2" stroke-dashoffset="270.2"></circle>
        </svg>
        <div class="num" id="ringNum">0%</div>
      </div>
      <div class="hero-txt">
        <div class="big" id="heroBig">还没开始</div>
        <div class="sm" id="heroSm"></div>
      </div>
    </div>

    <div class="cta">
      <button class="btn btn-resume" id="btnResume" hidden></button>
      <button class="btn btn-primary" id="btnAll"></button>
      <button class="btn btn-ghost" id="btnWeak"></button>
    </div>

    <div class="sec">
      <h2>按课文刷</h2>
      <span id="chapHint">12 篇 · 每篇 14–27 词</span>
    </div>
    <div class="grid" id="grid"></div>

    <div class="foot-tip">
      <span><span class="kbd">←</span>不认识</span>
      <span><span class="kbd">→</span>认识</span>
      <span><span class="kbd">空格</span>翻面</span>
      <span><span class="kbd">↑</span>退回上一个</span>
    </div>
  </section>

  <!-- ================= 学习页 ================= -->
  <section class="view" id="vStudy" hidden>
    <div class="study-bar">
      <button class="close" id="btnQuit" aria-label="退出">✕</button>
      <div class="pbar"><i id="pbar"></i></div>
      <div class="cnt" id="cnt"></div>
    </div>

    <div class="card" id="card">
      <div class="face front" id="faceFront">
        <span class="chap" id="fChap"></span>
        <span class="chip" id="fChip"></span>
        <div class="word" id="fWord"></div>
        <div class="ipa-row">
          <span class="ipa" id="fIpa"></span>
          <button class="spk-mini" id="btnSpkFront" aria-label="朗读">
            <svg viewBox="0 0 16 16" fill="none"><path d="M8.6 3.1v9.8L5.2 9.9H3a.9.9 0 0 1-.9-.9V7a.9.9 0 0 1 .9-.9h2.2L8.6 3.1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11.2 6a3.2 3.2 0 0 1 0 4M13 4.4a5.4 5.4 0 0 1 0 7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="tap-hint" id="tapHint">轻点卡片 · 看释义</div>
      </div>
      <div class="face back" id="faceBack" hidden>
        <span class="chap" id="bChap"></span>
        <button class="spk" id="btnSpk" aria-label="朗读">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8.6 3.1v9.8L5.2 9.9H3a.9.9 0 0 1-.9-.9V7a.9.9 0 0 1 .9-.9h2.2L8.6 3.1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11.2 6a3.2 3.2 0 0 1 0 4M13 4.4a5.4 5.4 0 0 1 0 7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <div class="bw" id="bWord"></div>
        <div class="bp" id="bIpa"></div>
        <div class="rule"></div>
        <div class="zrow">
          <span class="pos" id="bPos"></span>
          <div class="z" id="bZh"></div>
        </div>
        <div class="rule"></div>
        <div class="e" id="bEn"></div>
        <div class="ex" hidden id="bEx">
          <div class="en" id="bExEn"></div>
          <div class="zh" id="bExZh"></div>

ing what to expect and how to behave in the society in which an individual lives","z":"社会化","x":"Female socialization emphasizes getting along with others.","y":"女性的社会化强调与他人相处。","id":"socialization|Ch1 R3"},{"w":"appropriately","p":"əˈprəʊprɪətlɪ","t":"学术","c":"Ch1 R3","u":"Unit 1","o":"adv","e":"in an appropriate manner","z":"适当地","x":"The government has been accused of not responding appropriately to the needs of the homeless.","y":"政府未采取恰当的措施回应无家可归者的需要，为此已受到谴责。","id":"appropriately|Ch1 R3"},{"w":"task","p":"tɑ:sk","t":"学术","c":"Ch1 R3","u":"Unit 1","o":"n","e":"a piece of work that sb. has to do, especially a hard or unpleasant one","z":"（尤指艰巨或令人厌烦的）任务，工作","x":"Our first task is to set up a communications system.","y":"我们的首项任务是架设通信系统。","id":"task|Ch1 R3"},{"w":"agent","p":"ˈeɪdʒənt","t":"四级","c":"Ch1 R3","u":"Unit 1","o":"n","e":"a person whose job is to act for, or manage the affairs of, other people in business, politics, etc.","z":"（商业、政治等的）代理人，经纪人","x":"Our agent in New York deals with all US sales.","y":"我们在纽约的代理商经办在整个美国的销售。","id":"agent|Ch1 R3"},{"w":"sanction","p":"ˈsæŋkʃn","t":"六级","c":"Ch1 R3","u":"Unit 1","o":"n","e":"a course of action that can be used, if necessary, to make people obey a law or behave in a particular way","z":"制裁；约束；处罚","x":"The ultimate sanction will be the closure of the restaurant.","y":"最严厉的处罚将是关闭这家餐馆。","id":"sanction|Ch1 R3"},{"w":"model","p":"ˈmɒdl","t":"四级","c":"Ch1 R3","u":"Unit 1","o":"v","e":"take sb./sth. as an example for one’s action, plans, etc.","z":"以…为榜样；仿效","x":"The process of teaching by example is called modeling and it affects behavior far more than telling your children what to do.","y":"通过以身作则的方式教育孩子称为“言传身教”，这种管教方式远比直接告诉孩子该如何做效果来得更好。","id":"model|Ch1 R3"},{"w":"negative","p":"ˈnegətɪv","t":"学术","c":"Ch1 R3","u":"Unit 1","o":"adj","e":"considering only the bad side of sth./sb.; lacking enthusiasm or hope","z":"消极的，负面的；缺乏热情的","x":"Scientists have a fairly negative attitude to the theory.","y":"科学家对这个理论的态度是相当消极的。", sing direct force or orders","z":"影响（力），作用","x":"As a scientist, his influence was immense.","y":"身为一名科学家，他的影响力极大。","id":"influence|Ch2 R1"},{"w":"sociologist","p":"ˌsəʊsiˈɒlədʒɪst","t":"四级","c":"Ch2 R1","u":"Unit 1","o":"n","e":"a social scientist who studies the institutions and development of human society","z":"社会学家","x":"Professor Nee is the first and a leading sociologist to study market transition and institutional transformation.","y":"倪教授是第一位研究市场转型和制度变革的社会学家，也是该领域的领袖人物。","id":"sociologist|Ch2 R1"},{"w":"abnormal","p":"æbˈnɔ:rml","t":"学术","c":"Ch2 R1","u":"Unit 1","o":"adj","e":"being very different from usual in a way that seems strange, worrying, wrong, or dangerous","z":"不正常的；变态的","x":"My parents thought it was abnormal for a boy to be interested in ballet.","y":"我父母认为一个男孩子对芭蕾舞感兴趣并不正常。","id":"abnormal|Ch2 R1"},{"w":"norm","p":"nɔ:rm","t":"学术","c":"Ch2 R1","u":"Unit 1","o":"n","e":"the usual or normal situation, way of doing sth., etc.","z":"常态；标准；准则；规范","x":"Joyce’s style of writing was a striking departure from the literary norm.","y":"乔伊斯的写作风格与传统的文学规范大相径庭。","id":"norm|Ch2 R1"},{"w":"professional","p":"prəˈfeʃənl","t":"学术","c":"Ch2 R1","u":"Unit 1","o":"adj","e":"showing that someone has been well trained and is good at their work","z":"专业的，内行的","x":"This business plan looks very professional.","y":"该商业计划看上去很专业。","id":"professional|Ch2 R1"},{"w":"violate","p":"ˈvaɪəleɪt","t":"四级","c":"Ch2 R1","u":"Unit 1","o":"v","e":"to disobey or do sth. against an official agreement, law, principle, etc.","z":"违背，违反","x":"34 protesters were arrested for violating criminal law.","y":"34名抗议者因违反刑法而被逮捕。","id":"violate|Ch2 R1"},{"w":"penalty","p":"ˈpenəlti","t":"四级","c":"Ch2 R1","u":"Unit 1","o":"n","e":"a punishment for breaking a law, rule, or legal agreement","z":"（因违反法律、规则或合约而受到的）惩罚，处罚","x":"The fees and penalty charges ballooned.","y":"花费和罚款费用一路激增。","id":"penalty|Ch2 R1"},{"w":"aware","p":"əˈweə(r)","t":"学术","c":"Ch2 R1","u":"Unit 1","o":"adj","e":"having knowledge or realization of sb./sth.","z":"意识到的，明白的，知道的","x":"Mr. Braley has been made aware of the need for absolute secrecy.","y":"布雷利先生被告知需要绝对保密。","id":"aware|Ch2 R1"},{"w":"courtesy","p":"ˈkɜ:təsi","t":"六级","c":"Ch2 R1","u":"Unit 1","o":"n","e":"polite behaviour and respect for other people","z":"有礼的举止，礼貌","x":"It’s a matter of common courtesy to acknowledge letters.","y":"确认收到来信是起码的礼貌。","id":"courtesy|Ch2 R1"},{"w":"violation","p":"ˌvaɪəˈleɪʃn","t":"学术","c":"Ch2 R1","u":"Unit 1","o":"n","e":"an action that breaks a law, agreement, principle, etc.","z":"（对法律、协议、原则等的）违背，违反","x":"Troops crossed the border in violation of the agreement.","y":"部队违反协议，越过了边界。","id":"violation|Ch2 R1"},{"w":"severe","p":"sɪˈvɪə(r)","t":"四级","c":"Ch2 R1","u":"Unit 1","o":"adj","e":"(problems, injuries, illnesses, etc.) very bad or serious","z":"（问题、伤势、疾病等）很严重的","x":"His injuries were quite severe.","y":"他的伤势很严重。","id":"severe|Ch2 R1"},{"w":"enforce","p":"ɪnˈfɔ:s","t":"学术","c":"Ch2 R1","u":"Unit 1","o":"v","e":"to make people obey a rule or law","z":"执行，实施（法律）","x":"Parking restrictions will be strictly enforced.","y":"停车限制将会严格执行。","id":"enforce|Ch2 R1"},{"w":"crime","p":"kraɪm","t":"四级","c":"Ch2 R1","u":"Unit 1","o":"n","e":"illegal activities in general","z":"（泛指）犯罪活动","x":"We moved here because there was very little crime.","y":"我们搬到这里来是因为这里的犯罪率很低。","id":"crime|Ch2 R1"},{"w":"underlying","p":"ˌʌndəˈlaɪɪŋ","t":"六级","c":"Ch2 R1","u":"Unit 1","o":"adj","e":"in the nature of sth. though not readily apparent","z":"潜在的；根本的","x":"There is an underlying assumption that younger workers are easier to train.","y":"有一种潜在的假设，认为年轻一些的雇员容易培训。","id":"underlying|Ch2 R1"},{"w":"humility","p":"hju:ˈmɪləti","t":"六级","c":"Ch2 R1","u":"Unit 1","o":"n","e":"the quality of not being too proud about yourself","z":"谦逊，谦恭","x":"Her first defeat was an early lesson in humility.","y":"她的第一次失败使她很早便懂得了谦逊。","id":"humility|Ch2 R1"},{"w":"persist","p":"pəˈsɪst","t":"学术","c":"Ch2 R1","u":"Unit 1","o":"v","e":"to continue to exist","z":"持续；存留","x":"Fog will persist throughout the night.","y":"雾将整夜不散。","id":"persist|Ch2 R1"},{"w":"fertility","p":"fəˈtɪləti","t":"四级","c":"Ch2 R1","u":"Unit 1","o":"n","e":"the ability of a person, animal, or plant to produce babies, young animals, or seeds","z":"多产，生育能力，繁殖力","x":"Eggs symbolize fertility in some culture.","y":"某些文化中，蛋是多产的象征。","id":"fertility|Ch2 R1"},{"w":"peer","p":"pɪə(r)","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"the people who are the same age, or who have the same type of job, social class, etc.","z":"同龄人；社会地位相同的人","x":"American children did less well in math than their peers in Japan.","y":"美国儿童的数学成绩不如日本的同龄儿童。","id":"peer|Ch2 R2"},{"w":"adolescence","p":"ˌædəˈlesns","t":"六级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"the time, usually between the ages of 12 and 18, when a young person is developing into an adult","z":"青春期","x":"No one wants to go through adolescence again.","y":"没人想再一次经历青春期。","id":"adolescence|Ch2 R2"},{"w":"involve","p":"ɪnˈvɒlv","t":"学术","c":"Ch2 R2","u":"Unit 1","o":"v","e":"cause sb./sth. to take part in (an activity or a situation)","z":"使…参与（某活动）或陷入（某情况）","x":"We want to involve the workforce at all stages of the decision-making process.","y":"我们希望让职员全程参与决策。","id":"involve|Ch2 R2"},{"w":"be involved with","p":"","t":"学术","c":"Ch2 R2","u":"Unit 1","o":"phr.","e":"to connect closely","z":"涉及，与…有关联","x":"I don’t want my son to be involved with criminals.","y":"我不想让我的儿子同犯罪分子来往。","id":"be involved with|Ch2 R2"},{"w":"authority","p":"ɔ:ˈθɒrəti","t":"学术","c":"Ch2 R2","u":"Unit 1","o":"n","e":"power to give orders and make others obey","z":"权力；权威","x":"Only the president has the authority to declare war.","y":"只有总统才有权宣战。","id":"authority|Ch2 R2"},{"w":"ignore","p":"ɪgˈnɔ:(r)","t":"学术","c":"Ch2 R2","u":"Unit 1","o":"v","e":"to deliberately pay no attention to sth. that you have been told or that you know about","z":"（故意对知道的事）置之不理","x":"You can’t ignore the fact that many criminals never go to prison.","y":"你不能无视很多罪犯从未获刑的事实。","id":"ignore|Ch2 R2"},{"w":"rebel","p":"rɪˈbel","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"v","e":"to oppose or fight against someone in a position of control","z":"反叛","x":"The people have rebelled against their foreign rulers.","y":"人民反抗他们的外国统治者。","id":"rebel|Ch2 R2"},{"w":"rebellious","p":"rɪˈbeljəs","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"adj","e":"disobedient and hard to control","z":"反抗的，难控制的，反叛的","x":"The rebellious troops attempted to subvert the present government.","y":"叛军曾企图推翻现政府。","id":"rebellious|Ch2 R2"},{"w":"individualism","p":"ˌɪndɪˈvɪdʒuəlɪzəm","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"the belief that the rights and freedom of individual people are the most important rights in a society","z":"个人主义（视个人权利和自由至上的信仰）","x":"Capitalism encourages competition and individualism.","y":"资本主义鼓励竞争，提倡个人主义。","id":"individualism|Ch2 R2"},{"w":"distinct","p":"dɪˈstɪŋkt","t":"学术","c":"Ch2 R2","u":"Unit 1","o":"adj","e":"clearly different or separate","z":"明显的，独特的","x":"The party split into two distinct groups.","y":"该党分裂成两个截然不同的团体。","id":"distinct|Ch2 R2"},{"w":"celebrity","p":"səˈlebrəti","t":"六级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"a famous living person","z":"名人，明星","x":"He’s a national celebrity.","y":"他是全国有名的人物。","id":"celebrity|Ch2 R2"},{"w":"recreation","p":"ˌrekriˈeɪʃn","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"an activity that you do for pleasure or amusement","z":"娱乐，消遣","x":"His only recreations are drinking beer and watching football.","y":"他唯一的消遣就是喝啤酒、看球赛。","id":"recreation|Ch2 R2"},{"w":"incline","p":"ɪnˈklaɪn","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"v","e":"to influence someone towards a particular action or opinion","z":"使倾向于（某种行动或观点）","x":"The accident inclined him to reconsider his career.","y":"这次意外使他重新考虑他的职业。","id":"incline|Ch2 R2"},{"w":"be inclined to","p":"","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"phr.","e":"to have a tendency to do","z":"倾向于…","x":"The car is inclined to stall when it’s cold outside.","y":"这辆汽车天冷时爱熄火。","id":"be inclined to|Ch2 R2"},{"w":"financial","p":"faɪˈnænʃl","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"adj","e":"relating to money or the management of money","z":"财政的，金融的，财务的","x":"Organic farmers should be encouraged with financial incentives.","y":"应对实行有机栽培的农民给予经济上的鼓励。","id":"financial|Ch2 R2"},{"w":"approval","p":"əˈpru:vl","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"feeling or showing or saying that one thinks sth. is good or acceptable or satisfactory","z":"赞成；认可；满意；同意","x":"The president has already given his approval to the plan.","y":"总统已经批准了这个计划。","id":"approval|Ch2 R2"},{"w":"conformity","p":"kənˈfɔ:məti","t":"学术","c":"Ch2 R2","u":"Unit 1","o":"n","e":"behaving in the same way as most other people","z":"遵从，一致","x":"We must act in conformity with local regulations.","y":"我们必须按当地的法规行事。","id":"conformity|Ch2 R2"},{"w":"exclude","p":"ɪkˈsklu:d","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"v","e":"to deliberately not include sth.","z":"（故意）不包括；把…排除在外","x":"The judges decided to exclude evidence which had been unfairly attained.","y":"法官裁决不接纳以不正当手段获取的证据。","id":"exclude|Ch2 R2"},{"w":"clique","p":"klik","t":"六级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"a small group of people who think they are special and do not want other people to join them","z":"派系；小圈子；小集团（含贬义）","x":"All of the cliques were formed by high school students.","y":"这些都是由中学生组成的小圈子。","id":"clique|Ch2 R2"},{"w":"bullying","p":"ˈbuliŋ","t":"四级","c":"Ch2 R2","u":"Unit 1","o":"n","e":"the act of intimidating a weaker person to make them do sth.","z":"欺凌，恃强凌弱的行为","x":"She measured \"bullying incidents\" by distributing surveys to both the students and the teachers and found the answers to be remarkably consistent.","y":"她就“欺负事件”的发生次数向老师和同学进行了调查，发现两者的答案高度一致。","id":"bullying|Ch2 R2"},{"w":"tease","p":"tiz","t":"六级","c":"Ch2 R2","u":"Unit 1","o":"v","e":"to laugh at someone and make jokes in order to have fun by embarrassing them, either in a friendly way or in an unkind way","z":"戏弄，逗弄；拿…开玩笑","x":"Don’t get upset. I igion","z":"宗教的","x":"I don’t share her religious beliefs.","y":"我的宗教信仰和她的不同。","id":"religious|Ch2 R3"},{"w":"categorize","p":"ˈkætəɡəraɪz","t":"四级","c":"Ch2 R3","u":"Unit 1","o":"v","e":"to put people or things into groups according to the type of person or thing they are","z":"对…进行分类","x":"The population is categorized according to age, gender, and social group.","y":"人口根据年龄、性别和社会群体进行了分类。","id":"categorize|Ch2 R3"},{"w":"protest","p":"prəˈtest","t":"四级","c":"Ch2 R3","u":"Unit 1","o":"v","e":"express strong disagreement or disapproval about sth.","z":"抗议，反对","x":"Demonstrators protested outside the country’s embassies all over Europe.","y":"该国驻欧洲各国的大使馆外都有群众进行抗议。","id":"protest|Ch2 R3"},{"w":"tragedy","p":"ˈtrædʒədi","t":"四级","c":"Ch2 R3","u":"Unit 1","o":"n","e":"a very sad event that shocks people","z":"悲剧性事件，惨剧","x":"The tragedy happened as they were returning home from a night out.","y":"悲剧发生在他们夜里外出归来的路上。","id":"tragedy|Ch2 R3"},{"w":"hostile","p":"ˈhɒstaɪl","t":"四级","c":"Ch2 R3","u":"Unit 1","o":"adj","e":"angry and deliberately unfriendly towards someone, and ready to argue with them","z":"怀有敌意的，敌对的，不友善的","x":"Southampton fans gave their former coach a hostile reception.","y":"南安普敦队的球迷对前任教练很不友善。","id":"hostile|Ch2 R3"},{"w":"violent","p":"ˈvaɪələnt","t":"四级","c":"Ch2 R3","u":"Unit 1","o":"adj","e":"involving actions that are intended to injure or kill people, by hitting them, shooting them, etc.","z":"暴力的；强暴的","x":"31 people have been injured in violent incidents throughout the day.","y":"今天一天有31人在暴力事件中受伤。","id":"violent|Ch2 R3"},{"w":"panic","p":"ˈpænɪk","t":"四级","c":"Ch2 R3","u":"Unit 1","o":"n","e":"a sudden strong feeling of fear or nervousness that makes you unable to think clearly or behave sensibly","z":"惶恐，惊恐，惊慌","x":"She got into a panic when she couldn’t find the tickets.","y":"她找不到票，慌了起来。","id":"panic|Ch2 R3"},{"w":"irrational","p":"ɪˈræʃənl","t":"四级","c":"Ch2 R3","u":"Unit 1","o":"adj","e":"not based on clear thought or reason","z":"非理性的，不合理的，荒谬的", o describe or show sb./sth. in a particular way, especially when this does not give a complete or accurate impression of what they are like","z":"将…描写成；给人以某种印象","x":"Throughout the trial, he portrayed himself as the victim.","y":"在审讯过程中，他始终把自己说成是受害者。","id":"portray|Ch3 R3"},{"w":"body image","p":"","t":"学术","c":"Ch3 R3","u":"Unit2","o":"phr.","e":"a person’s perception of his or her body’s appearance","z":"（人们通过外界对自己体形及性别特征吸引力的评价而形成的）自我感觉","x":"From the survey, we can know 80% of men are not satisfied with their body image.","y":"根据调查，我们能知道八成的男性不满自己的形象。","id":"body image|Ch3 R3"},{"w":"close-up","p":"ˈkləʊsʌp","t":"六级","c":"Ch3 R3","u":"Unit2","o":"n","e":"a photograph, or picture in a film/movie, taken very close to sb./sth. so that it shows a lot of details","z":"（照相、电影的）特写，特写镜头","x":"It was strange to see her own face in close-up on the screen.","y":"在屏幕上看见她自己的脸部特写感觉很陌生。","id":"close-up|Ch3 R3"},{"w":"perceive","p":"pəˈsi:v","t":"学术","c":"Ch3 R3","u":"Unit2","o":"v","e":"to notice or become aware of sth.","z":"注意到；意识到；察觉到","x":"She perceived that all was not well.","y":"她意识到并非一切都顺利。","id":"perceive|Ch3 R3"},{"w":"survey","p":"sɜ:ˈveɪ","t":"四级","c":"Ch3 R3","u":"Unit2","o":"v","e":"to investigate the opinions or behaviour of a group of people by asking them a series of questions","z":"调查（某部分人）的行为﹑意见等","x":"We surveyed 500 smokers and found that over three quarters would like to give up.","y":"我们对500名吸烟者进行了调查，发现有超过四分之三的人愿意戒烟。","id":"survey|Ch3 R3"},{"w":"muscular","p":"ˈmʌskjələ(r)","t":"六级","c":"Ch3 R3","u":"Unit2","o":"adj","e":"having large strong muscles","z":"强壮的；肌肉发达的","x":"Like most female athletes, she was lean and muscular.","y":"像大多女运动员一样，她清瘦但肌肉发达。","id":"muscular|Ch3 R3"},{"w":"stereotype","p":"ˈsteriətaɪp","t":"六级","c":"Ch3 R3","u":"Unit2","o":"n","e":"a fixed idea or image that many people have of a particular type of person or thing, but which is often not true in reality","z":"模式化观念（或形象）；老一套；刻板印象","x":"Many men feel their body shape doesn’t live up to the stereotype of the ideal man.","y":"很多男人都觉得自己的体形不符合人们心目中惯有的理想男性形象。","id":"stereotype|Ch3 R3"},{"w":"co-star","p":"ˈkəʊstɑ:","t":"四级","c":"Ch3 R3","u":"Unit2","o":"n","e":"one of two or more famous actors who appear together in a film/movie or play","z":"（电影或戏剧中的）联袂主演明星","x":"During the filming, Curtis fell in love with his co-star, Christine Kaufmann.","y":"在电影摄制过程中，柯蒂斯爱上了同他联袂主演的明星克里斯汀·考夫曼。","id":"co-star|Ch3 R3"},{"w":"storyline","p":"ˈstɔ:rilaɪn","t":"六级","c":"Ch3 R3","u":"Unit2","o":"n","e":"the basic story in a novel, play, film/movie, etc.","z":"（小说、戏剧、电影等的）故事情节","x":"The surprise twists in the storyline are the film’s greatest strength.","y":"该影片最精彩之处就是剧情的曲折离奇。","id":"storyline|Ch3 R3"},{"w":"defend","p":"dɪˈfend","t":"四级","c":"Ch3 R3","u":"Unit2","o":"v","e":"to protect sb./sth. from attack","z":"防御；保护；保卫","x":"All our officers are trained to defend themselves against knife attacks.","y":"我们所有的警察都接受过自卫训练，能够对付持刀袭击。","id":"defend|Ch3 R3"},{"w":"reinforce","p":"ˌri:ɪnˈfɔ:s","t":"学术","c":"Ch3 R3","u":"Unit2","o":"v","e":"to make a feeling, an idea, etc. stronger","z":"加强；充实；使更强烈","x":"Such jokes tend to reinforce racial stereotypes.","y":"这样的笑话容易渲染种族偏见。","id":"reinforce|Ch3 R3"},{"w":"comic","p":"ˈkɒmɪk","t":"四级","c":"Ch3 R3","u":"Unit2","o":"n","e":"a magazine, especially for children, that tells stories through pictures","z":"（尤指儿童看的）连环画杂志","x":"Joe loved to read “Superman” comics.","y":"乔喜欢看《超人》的漫画","id":"comic|Ch3 R3"},{"w":"source","p":"sɔ:s","t":"四级","c":"Ch3 R3","u":"Unit2","o":"n","e":"a place, person or thing that you get sth. from","z":"来源；出处","x":"Our local library will be a useful source of information.","y":"我们当地的图书馆就是很好的资料来源。","id":"source|Ch3 R3"},{"w":"submissive","p":"səbˈmɪsɪv","t":"六级","c":"Ch3 R3","u":"Unit2","o":"adj","e":"willing to accept sb. else’s authority and willing to obey them without questioning anything they want you to do","z":"唯命是从的；顺从的；驯服的；听话的","x":"He expected his daughters to be meek and submissive.","y":"他期望女儿们都温顺听话。","id":"submissive|Ch3 R3"},{"w":"sexualize","p":"ˈsekʃuəlaɪz","t":"六级","c":"Ch3 R3","u":"Unit2","o":"v","e":"To sexualize sb./sth. means to make them sexual or consider them in a sexual way.","z":"使有性别；使有性征","x":"Referring to children’s friends as girlfriends and boyfriends sexualizes them.","y":"将孩子们的朋友称为女朋友或男朋友就把他们的性别差异凸显出来了。","id":"sexualize|Ch3 R3"},{"w":"exaggerate","p":"ɪgˈzædʒəreɪt","t":"四级","c":"Ch3 R3","u":"Unit2","o":"v","e":"to make sth. seem larger, better, worse or more important than it really is","z":"夸张；夸大","x":"He tends to exaggerate the difficulties.","y":"他往往夸大困难。","id":"exaggerate|Ch3 R3"},{"w":"feature","p":"ˈfi:tʃə(r)","t":"学术","c":"Ch3 R3","u":"Unit2","o":"n","e":"something important, interesting or typical of a place or thing","z":"特色；特征；特点","x":"An interesting feature of the city is the old market.","y":"老市场是这座城市有趣的特点。","id":"feature|Ch3 R3"},{"w":"initial","p":"ɪˈnɪʃl","t":"四级","c":"Ch3 R3","u":"Unit2","o":"adj","e":"happening at the beginning; first","z":"最初的；开始的；第一的","x":"My initial reaction was to decline the offer.","y":"我最初的反应是要拒绝这个提议。","id":"initial|Ch3 R3"},{"w":"privilege","p":"ˈprɪvəlɪdʒ","t":"四级","c":"Ch3 R3","u":"Unit2","o":"n","e":"a special right or advantage that a particular person or group of people has","z":"特殊利益；优惠待遇","x":"Education should be a universal right and not a privilege.","y":"教育应当是全民的权利，而非某部分人特别享有的。","id":"privilege|Ch3 R3"},{"w":"pharmacist","p":"ˈfɑ:məsɪst","t":"六级","c":"Ch4 R1","u":"Unit2","o":"n","e":"(North American English also druggist) a person whose job is to prepare medicines and sell or give them to the public in a shop/store or in a hospital","z":"药剂师","x":"We had to wait for the pharmacist to make up her prescription.","y":"我们只得等药剂师给她配好药。","id":"pharmacist|Ch4 R1"},{"w":"labor","p":"ˈleɪbə(r)","t":"学术","c":"Ch4 R1","u":"Unit2","o":"n","e":"work, especially physical work","z":"劳动；（尤指）体力劳动","x":"Division of labour is important in industry today.","y":"劳动分工在今天的行业中很重要。","id":"labor|Ch4 R1"},{"w":"struggle","p":"ˈstrʌgl","t":"四级","c":"Ch4 R1","u":"Unit2","o":"n","e":"a hard fight in which people try to obtain or achieve sth., especially sth. that sb. else does not want them to have","z":"斗争；奋斗；努力","x":"She will not give up her children without a struggle.","y":"她不会轻易放弃自己的孩子","id":"struggle|Ch4 R1"},{"w":"shift","p":"ʃɪft","t":"四级","c":"Ch4 R1","u":"Unit2","o":"v","e":"(of a situation, an opinion, a policy, etc.) to change from one state, position, etc. to another","z":"（情况、意见、政策等）变换；更替；变动","x":"Public attitudes towards marriage have shifted over the past 50 years.","y":"50年来，公众对婚姻的态度已经改变。","id":"shift|Ch4 R1"},{"w":"contribution","p":"ˌkɒntrɪˈbju:ʃn","t":"学术","c":"Ch4 R1","u":"Unit2","o":"n","e":"an action or a service that helps to cause or increase sth.","z":"贡献；促成作用","x":"He made a very positive contribution to the success of the project.","y":"他对项目的成功贡献良多。","id":"contribution|Ch4 R1"},{"w":"period","p":"ˈpɪəriəd","t":"学术","c":"Ch4 R1","u":"Unit2","o":"n","e":"a particular length of time","z":"一段时间；时期","x":"All these changes happened over a period of time.","y":"所有这些变化都是在一段时间内发生的","id":"period|Ch4 R1"},{"w":"approximately","p":"əˈprɒksɪmətli","t":"学术","c":"Ch4 R1","u":"Unit2","o":"adv","e":"used to show that sth. is almost, but not completely, accurate or correct","z":"大概；大约；约莫","x":"The journey took approximately seven hours.","y":"旅程大约花了七个小时。","id":"approximately|Ch4 R1"},{"w":"panel","p":"ˈpænl","t":"四级","c":"Ch4 R1","u":"Unit2","o":"n","e":"A panel is a small group of people who are chosen to do sth., for example to discuss sth. in public or to make a decision.","z":"（进行公开讨论或作决策的）专门小组","x":"He assembled a panel of scholars to advise him.","y":"他组织了一个学者小组为他出谋划策。","id":"panel|Ch4 R1"},{"w":"dynamics","p":"daɪˈnæmɪks","t":"六级","c":"Ch4 R1","u":"Unit2","o":"n","e":"the way in which people or things behave and react to each other in a particular situation","z":"（人或事物）相互作用的方式，动态","x":"The interchange of ideas aids an understanding of family dynamics.","y":"思想的交流有助于理解家庭动态。","id":"dynamics|Ch4 R1"},{"w":"commitment","p":"kəˈmɪtmənt","t":"六级","c":"Ch4 R1","u":"Unit2","o":"n","e":"the willingness to work hard and give your energy and time to a job or an activity","z":"（对工作或某活动）献身，奉献，投入","x":"A career as an actor requires one hundred percent commitment.","y":"干演员这一行需要百分之百的投入。","id":"commitment|Ch4 R1"},{"w":"flexibility","p":"ˌfleksəˈbɪlətɪ","t":"六级","c":"Ch4 R1","u":"Unit2","o":"n","e":"the quality of being able to change or be changed easily according to the situation","z":"灵活可变性","x":"I enjoyed the flexibility of the schedule.","y":"我喜欢这个有弹性的时间安排。","id":"flexibility|Ch4 R1"},{"w":"sole","p":"səʊl","t":"学术","c":"Ch4 R1","u":"Unit2","o":"adj","e":"only; single","z":"仅有的；唯一的","x":"This is the sole means of access to the building.","y":"这是这栋建筑物唯一的入口。","id":"sole|Ch4 R1"},{"w":"provider","p":"prəˈvaɪdə(r)","t":"四级","c":"Ch4 R1","u":"Unit2","o":"n","e":"a person or an organization that supplies sb. with sth. they need or want","z":"供应者；提供者；供养人","x":"The eldest son is the family’s sole provider.","y":"这家的长子是唯一养家糊口的人。","id":"provider|Ch4 R1"},{"w":"micromanage","p":"ˈmaɪkrəʊmænɪdʒ","t":"学术","c":"Ch4 R1","u":"Unit2","o":"v","e":"to control every part of a situation, even small details","z":"细致入微地管理","x":"We wish to empower our people rather than micromanage them.","y":"我们希望赋予员工广泛的权力，而不进行琐碎的管理。","id":"micromanage|Ch4 R1"},{"w":"apparent","p":"əˈpærənt","t":"四级","c":"Ch4 R1","u":"Unit2","o":"adj","e":"easy to see or understand","z":"显而易见的；明白易懂的；显然的","x":"Their devotion was apparent.","y":"他们的忠诚显而易见。","id":"apparent|Ch4 R1"},{"w":"complex","p":"ˈkɒmpleks","t":"学术","c":"Ch4 R2","u":"Unit2","o":"adj","e":"made of many different things or parts that are connected; difficult to understand","z":"复杂的；难懂的；费解的","x":"Today’s complex buildings require close teamwork between the architect and the builders.","y":"如今的建筑结构复杂，需要建筑师和施工人员密切协作。","id":"complex|Ch4 R2"},{"w":"discrimination","p":"dɪˌskrɪmɪˈneɪʃn","t":"学术","c":"Ch4 R2","u":"Unit2","o":"n","e":"the practice of treating sb. or a particular group in society less fairly than others","z":"区别对待；歧视；偏袒","x":"The Sex Discrimination Act has not eliminated discrimination in employment.","y":"《反性别歧视法》并未根除工作场合的歧视。","id":"discrimination|Ch4 R2"},{"w":"in-law","p":"ˈɪn lɔ:","t":"六级","c":"Ch4 R2","u":"Unit2","o":"n","e":"a parent of your husband or wife or a member of his or her family","z":"姻亲；内亲","x":"Interfering in-laws are the prime sources of the blues.","y":"喜欢指手画脚的姻亲最让人头疼。","id":"in-law|Ch4 R2"},{"w":"identity","p":"aɪˈdentəti","t":"六级","c":"Ch4 R2","u":"Unit2","o":"n","e":"who or what sb./sth. is","z":"身份","x":"They are a lost generation in search of an identity.","y":"他们属于迷惘的一代，想要找寻自我。","id":"identity|Ch4 R2"},{"w":"regard","p":"rɪˈgɑ:d","t":"四级","c":"Ch4 R2","u":"Unit2","o":"v","e":"to think about sb./sth. in a particular way","z":"将…认为；把…视为；看待","x":"Capital punishment was regarded as inhuman and immoral.","y":"死刑过去被认为是非人道且不道德的。","id":"regard|Ch4 R2"},{"w":"crush","p":"krʌʃ","t":"四级","c":"Ch4 R2","u":"Unit2","o":"v","e":"to destroy sb.’s confidence or happiness","z":"破坏，毁坏（某人的信心或幸福）","x":"She felt completely crushed by the teacher’s criticism.","y":"老师的批评使她觉得自己全完了。","id":"crush|Ch4 R2"},{"w":"equate","p":"ɪˈkweɪt","t":"学术","c":"Ch4 R2","u":"Unit2","o":"v","e":"to think that sth. is the same as sth. else or is as important","z":"同等看待；使等同","x":"Some parents equate education with exam success.","y":"有些父母认为教育就是考试成绩优秀。","id":"equate|Ch4 R2"},{"w":"identification","p":"aɪˌdentɪfɪˈkeɪʃn","t":"六级","c":"Ch4 R2","u":"Unit2","o":"n","e":"the process of recognizing that sth. exists, or is important","z":"确认；识别","x":"The early identification of children with special educational needs is very important.","y":"早期确认儿童有特殊教育需求很重要。","id":"identification|Ch4 R2"},{"w":"strain","p":"streɪn","t":"四级","c":"Ch4 R2","u":"Unit2","o":"n","e":"severe demand on one’s mental or physical strength, resources, abilities, etc.","z":"对智力﹑体力﹑财力﹑能力等的严格要求；负担；压力","x":"Their marriage is under great strain at the moment.","y":"眼下他们的婚姻关系非常紧张","id":"strain|Ch4 R2"},{"w":"masculinity","p":"ˌmæskjuˈlɪnəti","t":"学术","c":"Ch4 R2","u":"Unit2","o":"n","e":"the quality of being masculine","z":"男子气概；男性；阳性","x":"The old ideas of masculinity do not work for most men.","y":"对于大多数男人来说，关于男子气概的老套观点现在已不再适用了。","id":"masculinity|Ch4 R2"},{"w":"self-reliant","p":"ˌself rɪˈlaɪənt","t":"六级","c":"Ch4 R2","u":"Unit2","o":"adj","e":"able to do or decide things by yourself, rather than depending on other people for help","z":"自立的；自力更生的；自主的","x":"Raising self-reliant children requires parents at times to lead with their heads and not their hearts.","y":"培养有自立能力的孩子要求家长们不时地用理智而不是感情来引导孩子。","id":"self-reliant|Ch4 R2"},{"w":"urge","p":"ɜ:dʒ","t":"四级","c":"Ch4 R2","u":"Unit2","o":"v","e":"to advise or try hard to persuade sb. to do sth.","z":"敦促；催促；力劝","x":"The report urged that all children be taught to swim.","y":"这份报告呼吁给所有的儿童教授游泳。","id":"urge|Ch4 R2"},{"w":"stressful","p":"ˈstresfl","t":"学术","c":"Ch4 R2","u":"Unit2","o":"adj","e":"causing a lot of anxiety and worry","z":"压力重的；紧张的","x":"Parenting can be a stressful business.","y":"为人父母是一件压力很大的事。","id":"stressful|Ch4 R2"},{"w":"depression","p":"dɪˈpreʃn","t":"六级","c":"Ch4 R2","u":"Unit2","o":"n","e":"the state of feeling very sad and without hope","z":"抑郁；沮丧；消沉","x":"Lack of exercise can lead to feelings of depression and exhaustion.","y":"缺乏锻炼会导致抑郁和疲劳。","id":"depression|Ch4 R2"},{"w":"conform to","p":"","t":"六级","c":"Ch4 R2","u":"Unit2","o":"phr.","e":"to behave and think in the same way as most other people in a group or society","z":"顺从，顺应（大多数人或社会）；随潮流","x":"He refused to conform to the local customs.","y":"他拒绝遵从当地的风俗习惯。","id":"conform to|Ch4 R2"},{"w":"humiliation","p":"hju:ˌmɪlɪˈeɪʃn","t":"六级","c":"Ch4 R2","u":"Unit2","o":"n","e":"Humiliation is the embarrassment and shame you feel when someone makes you appear stupid, or when you make a mistake in public.","z":"耻辱；屈辱；丢脸；蒙羞","x":"She faced the humiliation of discussing her husband’s affair lease state your name, age and occupationbelow.","y":"请在下面写明姓名、年龄和职业。","id":"occupation|Ch4 R2"},{"w":"underlie","p":"ʌndəˈlaɪ","t":"学术","c":"Ch4 R2","u":"Unit2","o":"v","e":"(formal) to be the basis or cause of sth.","z":"位于…之下；构成…的基础","x":"It is a principle that underlies all the party’s policies.","y":"这是贯穿该党各项政策的一条准则。","id":"underlie|Ch4 R2"},{"w":"ruling","p":"ˈru:lɪŋ","t":"学术","c":"Ch4 R2","u":"Unit2","o":"n","e":"an official decision made by sb. in a position of authority, especially a judge","z":"裁决；裁定；判决","x":"The court will make its ruling on the case next week.","y":"法庭下周将对本案件作出裁决。","id":"ruling|Ch4 R2"},{"w":"sexism","p":"ˈseksɪzəm","t":"学术","c":"Ch4 R3","u":"Unit2","o":"n","e":"discrimination based on gender","z":"性别歧视","x":"There was blatant sexism in the selection of staff.","y":"挑选职员时有明显的性别歧视。","id":"sexism|Ch4 R3"},{"w":"goal","p":"gəʊl","t":"学术","c":"Ch4 R3","u":"Unit2","o":"n","e":"​something that you hope to achieve","z":"目标；目的","x":"Our ultimate goal is the preservation of the environment.","y":"我们的最终目标是保护环境。","id":"goal|Ch4 R3"},{"w":"status","p":"ˈsteɪtəs","t":"学术","c":"Ch4 R3","u":"Unit2","o":"n","e":"​the social or professional position of sb./sth. in relation to others","z":"地位；身份；职位","x":"Women are only asking to be given equal status with men.","y":"妇女只是要求得到和男人平等的地位。","id":"status|Ch4 R3"},{"w":"subordinate","p":"səˈbɔ:dɪnət","t":"六级","c":"Ch4 R3","u":"Unit2","o":"adj","e":"​having less power or authority than sb. else in a group or an organization","z":"隶属的；从属的；下级的","x":"In many societies women are subordinate to men.","y":"在许多社会中，妇女都从属于男人。","id":"subordinate|Ch4 R3"},{"w":"executive","p":"ɪgˈzekjətɪv","t":"四级","c":"Ch4 R3","u":"Unit2","o":"n","e":"​a person who has an important job as a manager of a company or an organization","z":"（公司或机构的）经理，主管领导，管理人员","x":"He is respected as a very aggressive and competitive executive.","y":"他是一位锐意进取、竞争意识很强的主管，颇受尊敬。","id":"executive|Ch4 R3"},{"w":"respondent","p":"rɪˈspɒndənt","t":"学术","c":"Ch4 R3","u":"Unit2","o":"n","e":"​a person who answers questions, especially in a survey","z":"回答问题的人；（尤指）调查对象","x":"60% of the respondents agreed with the suggestion.","y":"回复调查的人中60%同意这项建议。","id":"respondent|Ch4 R3"},{"w":"prohibit","p":"prəˈhɪbɪt","t":"四级","c":"Ch4 R3","u":"Unit2","o":"v","e":"​to stop sth. from being done","z":"（尤指以法令）禁止","x":"Local zoning laws prohibit building near property lines.","y":"本地的规划法禁止在地产边界附近进行建筑施工。","id":"prohibit|Ch4 R3"},{"w":"disparity","p":"dɪˈspærəti","t":"学术","c":"Ch4 R3","u":"Unit2","o":"n","e":"​(formal) a difference, especially one connected with unfair treatment","z":"（尤指因不公正对待引起的）不同，不等，差异","x":"The disparity in incomes among different professions was small.","y":"各职业收入的差距比较小。","id":"disparity|Ch4 R3"},{"w":"rear","p":"rɪə(r)","t":"四级","c":"Ch4 R3","u":"Unit2","o":"v","e":"​to care for young children or animals until they are fully grown","z":"抚养；养育；培养","x":"She reared a family of five on her own.","y":"她一个人养活一家五口。","id":"rear|Ch4 R3"},{"w":"compensation","p":"ˌkɒmpenˈseɪʃn","t":"学术","c":"Ch4 R3","u":"Unit2","o":"n","e":"​something, especially money, that sb. gives you because they have hurt you, or damaged sth. that you own; the act of giving this to sb.","z":"赔偿物；补偿金；赔偿","x":"He received one year’s salary as compensation for loss of office.","y":"他得到一年的工资作为失业补偿金。","id":"compensation|Ch4 R3"},{"w":"forum","p":"ˈfɔ:rəm","t":"六级","c":"Ch4 R3","u":"Unit2","o":"n","e":"​a place where people can exchange opinions and ideas on a particular issue; a meeting organized for this purpose","z":"公共讨论场所；论坛；讨论会","x":"Television is now an important forum for political debate.","y":"电视已成了政治辩论的重要擂台。","id":"forum|Ch4 R3"},{"w":"cooperation","p":"kəʊˌɒpəˈreɪʃn","t":"学术","c":"Ch4 R3","u":"Unit2","o":"n","e":"​the fact of doing sth. together or of working together towards a shared aim","z":"合作；协作","x":"We would like to see closer cooperation between parents and schools.","y":"我们希望学生家长和学校有更加紧密的合作。","id":"cooperation|Ch4 R3"},{"w":"predict","p":"prɪˈdɪkt","t":"四级","c":"Ch4 R3","u":"Unit2","o":"v","e":"​to say that sth. will happen in the future","z":"预言；预告；预报","x":"Nobody could predict the outcome.","y":"谁也无法预料结果如何。","id":"predict|Ch4 R3"},{"w":"attribute","p":"əˈtrɪbju:t","t":"四级","c":"Ch4 R3","u":"Unit2","o":"n","e":"​a quality or feature of sb./sth.","z":"属性；性质；特征","x":"Patience is one of the most important attributes in a teacher.","y":"耐心是教师最重要的品质之一。","id":"attribute|Ch4 R3"}];

/* ---------- 存储 ---------- */
const KEY = 'vocab.sprint.u12.v1';
const DEF = { cards:{}, settings:{shuffle:false, skipL4:false, autoSpeak:false}, last:null, session:null };
let DB = load();

/* 存储可用性：隐私模式 / 微信文件预览里 localStorage 会被禁，要明确告诉用户 */
let STORAGE_OK = true;
try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); }catch(e){ STORAGE_OK = false; }

let toastTimer = null;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    const o = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEF)), o, {settings:Object.assign({},DEF.settings,o.settings||{})});
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

function cardState(id){ return DB.cards[id] || null; }
function isMastered(id){ const c=DB.cards[id]; return !!c && c.s>=1; }   // 答对一次即算拿下（冲刺：先过一遍筛出不会的）

/* ---------- 首页 ---------- */
function chapters(){
  const seen=[];
  DATA.forEach(d=>{ if(!seen.includes(d.c)) seen.push(d.c); });
  return seen;
}

function renderHome(){
  const total = DATA.length;
  const mastered = DATA.filter(d=>isMastered(d.id)).length;
  const touched = DATA.filter(d=>cardState(d.id)).length;
  const pct = Math.round(mastered/total*100);

  $('homeSub').textContent = `读写教程 · Unit 1–2 · ${total} 词 · ${chapters().length} 篇课文`;

  const C = 2*Math.PI*43;
  $('ringFg').style.strokeDashoffset = C*(1-mastered/total);
  $('ringFg').style.strokeLinecap = mastered>0 ? 'round' : 'butt';
  $('ringNum').textContent = pct+'%';

  if(mastered===0 && touched===0){
    $('heroBig').textContent = '还没开始';
    $('heroSm').innerHTML = `共 <b>${total}</b> 个词，分 <b>${chapters().length}</b> 篇课文<br>一轮约 12 分钟`;
  }else{
    $('heroBig').textContent = `已掌握 ${mastered} / ${total}`;
    const left = total - mastered;
    $('heroSm').innerHTML = left>0
      ? `还有 <b>${left}</b> 个没拿下${DB.last?` · 上次 ${DB.last}`:''}`
      : `全部拿下 🎉`;
  }

  // 存储警告
  const wb = $('warnbar');
  wb.classList.toggle('show', !STORAGE_OK);
  if(!STORAGE_OK){
    wb.textContent = '当前打开方式不允许本地存储，进度不会被保存。请在 Safari 里直接打开网址（微信里预览文件会这样）。';
  }

  // 继续上次
  const ss = DB.session;
  if(ss && ss.ids && ss.i < ss.ids.length){
    $('btnResume').hidden = false;
    $('btnResume').innerHTML = `继续上次 <span class="n">· ${esc(ss.label)} ${ss.i}/${ss.ids.length}</span>`;
  }else{
    $('btnResume').hidden = true;
  }

  const all = DATA.filter(d=>!(DB.settings.skipL4 && d.t==='四级'));
  $('btnAll').innerHTML = `开始冲刺 <span class="n">· ${all.length} 词</span>`;
  $('btnAll').disabled = all.length===0;

  const weak = DATA.filter(d=>!isMastered(d.id) && !(DB.settings.skipL4 && d.t==='四级'));
  const nothingYet = DATA.every(d=>!cardState(d.id));
  if(nothingYet){
    $('btnWeak').textContent = '先刷一轮，再来筛错词';
    $('btnWeak').disabled = true;
  }else{
    $('btnWeak').innerHTML = weak.length ? `只刷没掌握的 <span class="n">· ${weak.length} 词</span>` : '全部已掌握';
    $('btnWeak').disabled = weak.length===0;
  }

  // 关卡网格
  const g = $('grid'); g.innerHTML='';
  chapters().forEach(ch=>{
    const items = DATA.filter(d=>d.c===ch);
    const m = items.filter(d=>isMastered(d.id)).length;
    const [c,r] = ch.replace('Ch','').split(' R');
    const el = document.createElement('button');
    el.className = 'cell' + (m===items.length?' done':'');
    el.innerHTML = `<div class="cn">Ch${c}<span class="sep">·</span>R${r}</div>
                    <div class="pg">${m}/${items.length}</div>
                    <div class="bar" style="width:${m/items.length*100}%"></div>`;
    el.onclick = ()=>startChapter(ch);
    g.appendChild(el);
  });

  $('l4sub').textContent = `${DATA.filter(d=>d.t==='四级').length} 个，多半已经认识`;
  $('swShuffle').classList.toggle('on', DB.settings.shuffle);
  $('swSkipL4').classList.toggle('on', DB.settings.skipL4);
  $('swSpeak').classList.toggle('on', DB.settings.autoSpeak);
}

/* ---------- 组卷 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildDeck(list){
  let arr = list.slice();
  if(DB.settings.skipL4) arr = arr.filter(d=>d.t!=='四级');
  if(DB.settings.shuffle) shuffle(arr);
  return arr;
}

function startDeck(list, label){
  const deck = buildDeck(list);
  if(!deck.length){ toast('没有可刷的词'); return; }
  S.deck = deck; S.i=0; S.stage='front'; S.judged=null; S.right=0; S.wrong=0;
  S.wrongList=[]; S.history=[]; S.t0=Date.now(); S.label=label;
  show('study');
  renderCard();
  persistSession();
}

/* ---------- 断点续传 ---------- */
function persistSession(){
  if(S.view!=='study' || !S.deck.length) return;
  DB.session = {
    label: S.label,
    ids: S.deck.map(d=>d.id),
    i: S.i,
    right: S.right,
    wrong: S.wrong,
    wrongIds: S.wrongList.map(d=>d.id),
    t0: S.t0,
    ts: Date.now()
  };
  save();
}
function clearSession(){ DB.session = null; save(); }

function resumeSession(){
  const ss = DB.session;
  if(!ss || !ss.ids) return;
  const deck = ss.ids.map(id=>DATA.find(d=>d.id===id)).filter(Boolean);
  if(!deck.length){ clearSession(); renderHome(); return; }
  S.deck = deck;
  S.i = Math.max(0, Math.min(ss.i||0, deck.length));
  S.right = ss.right||0;
  S.wrong = ss.wrong||0;
  S.wrongList = (ss.wrongIds||[]).map(id=>DATA.find(d=>d.id===id)).filter(Boolean);
  S.t0 = Date.now();           // 用时按本次重新计
  S.label = ss.label || '上次';
  S.history = [];
  S.stage='front'; S.judged=null;
  show('study');
  if(S.i >= deck.length) finish(); else renderCard();
}

function startAll(){ startDeck(DATA, '全部'); }
function startWeak(){ startDeck(DATA.filter(d=>!isMastered(d.id)), '没掌握的'); }
function startChapter(ch){ startDeck(DATA.filter(d=>d.c===ch), ch); }

/* ---------- 学习页 ---------- */
function renderCard(){
  const d = S.deck[S.i];
  if(!d){ finish(); return; }
  S.stage='front'; S.judged=null;

  const el = $('card');
  el.querySelectorAll('.badge-ok,.badge-no').forEach(n=>n.remove());

  $('faceFront').hidden=false; $('faceBack').hidden=true;
  $('fChap').textContent = d.c;
  $('bChap').textContent = d.c;
  $('fChip').className = 'chip '+(TAGCLS[d.t]||'l4');
  $('fChip').textContent = d.t;
  $('fWord').textContent = d.w;
  $('fIpa').textContent = d.p ? '/'+d.p+'/' : '';
  $('btnSpkFront').hidden = false;
  $('tapHint').textContent = '轻点卡片 · 看释义';

  $('bWord').textContent = d.w;
  $('bIpa').textContent = d.p ? '/'+d.p+'/' : '';
  $('bPos').textContent = d.o || '';
  $('bZh').textContent = d.z;
  $('bEn').textContent = d.e;
  if(d.x){ $('bEx').hidden=false; $('bExEn').textContent=d.x; $('bExZh').textContent=d.y||''; }
  else $('bEx').hidden=true;

  setActions('ask');
  $('btnUndo').disabled = !S.history.length;

  updateBar();
  if(DB.settings.autoSpeak) speak(d.w);
}

function updateBar(){
  const n = S.deck.length;
  $('pbar').style.width = (S.i/n*100)+'%';
  $('pbar').classList.toggle('on', S.i>0);

  // 剩余时间预估：按本次已刷速度算
  let eta = '';
  const elapsed = (Date.now() - S.t0) / 1000;
  if(S.i >= 5 && elapsed > 4){
    const left = (n - S.i) * (elapsed / S.i);
    if(left >= 60) eta = ' · 约 ' + Math.round(left/60) + ' 分';
    else if(left >= 15) eta = ' · 约 ' + Math.round(left) + ' 秒';
  }
  $('cnt').innerHTML = `<b>${Math.min(S.i+1,n)}</b>/${n}${eta}`;
}

/* 底部按钮形态：ask = 不认识/认识；judged = 单个"继续"；revealed = 已翻面未判 */
function setActions(mode){
  const no = $('btnNo'), yes = $('btnYes'), undo = $('btnUndo');
  if(mode === 'judged'){
    no.hidden = true;
    yes.hidden = false;
    yes.textContent = '继续 →';
    yes.className = 'btn btn-next';
    undo.hidden = false;
  }else if(mode === 'revealed'){
    no.hidden = false;
    no.textContent = '不认识';
    no.className = 'btn btn-no';
    yes.hidden = false;
    yes.textContent = '认识';
    yes.className = 'btn btn-yes';
    undo.hidden = false;
  }else{
    no.hidden = false;
    no.textContent = '不认识';
    no.className = 'btn btn-no';
    yes.hidden = false;
    yes.textContent = '认识';
    yes.className = 'btn btn-yes';
    undo.hidden = false;
  }
}

function flip(){
  if(S.stage!=='front') return;
  S.stage='back';
  $('faceFront').hidden=true;
  $('faceBack').hidden=false;
  // 已判过（答错自动翻面）时按钮变成"继续"
  if(S.judged){
    setActions('judged');
  }
}

function judge(v){
  const d = S.deck[S.i];
  if(!d) return;

  if(S.judged){
    // 已经判过（答错看答案中），任意按钮 = 下一张
    next(); return;
  }

  // 撤销点必须在改 DB 之前记
  S.history.push({ i:S.i, id:d.id, prev: DB.cards[d.id] ? Object.assign({}, DB.cards[d.id]) : null, kind:v });

  S.judged = v;
  const rec = DB.cards[d.id] || {s:0,w:0};
  if(v==='right'){
    rec.s = (rec.s||0)+1;
    rec.w = rec.w||0;
    DB.cards[d.id]=rec;
    S.right++;
    save();
    next();   // 答对立即切，零等待
    persistSession();
  }else{
    rec.s = 0;
    rec.w = (rec.w||0)+1;
    DB.cards[d.id]=rec;
    S.wrong++;
    S.wrongList.push(d);
    save();
    flip(); // 强制看答案
    $('btnUndo').disabled = false;
    updateBar();
    persistSession();
  }
}

/* 退回上一个：撤销最后一次判定并回到那张卡 */
function undo(){
  if(!S.history.length) return;
  const h = S.history.pop();
  if(h.prev) DB.cards[h.id] = h.prev; else delete DB.cards[h.id];

  if(h.kind === 'right') S.right = Math.max(0, S.right-1);
  else { S.wrong = Math.max(0, S.wrong-1); S.wrongList.pop(); }

  S.i = h.i;
  S.stage = 'front'; S.judged = null;
  save();
  if(S.view !== 'study') show('study');
  renderCard();
  persistSession();
}

function flash(kind){
  const el=document.createElement('div');
  el.className = kind==='ok'?'badge-ok':'badge-no';
  $('card').appendChild(el);
  setTimeout(()=>el.remove(), 400);
}

function next(){
  S.i++;
  if(S.i >= S.deck.length){ finish(); return; }
  renderCard();
  persistSession();
}

function finish(){
  const n = S.deck.length;
  const secs = Math.round((Date.now()-S.t0)/1000);
  const pct = n? Math.round(S.right/n*100) : 0;

  const C = 2*Math.PI*43;
  $('doneRing').style.strokeDashoffset = C*(1-pct/100);
  $('donePct').textContent = pct+'%';

  const mm = secs>=60 ? `${Math.floor(secs/60)} 分 ${secs%60} 秒` : `${secs} 秒`;
  $('doneTitle').textContent = pct>=90 ? '这轮很稳' : pct>=70 ? '差不多了' : '还得再过一遍';
  $('doneSub').innerHTML = `${S.label} · 共 <b>${n}</b> 词 · 认识 <b>${S.right}</b> · 用时 ${mm}`;

  // 去重（同一词可能错多次）
  const seen=new Set(); const weak=[];
  S.wrongList.forEach(d=>{ if(!seen.has(d.id)){ seen.add(d.id); weak.push(d); } });

  $('weakTitle').textContent = weak.length? '没拿下的词' : '这轮全对';
  $('weakCount').textContent = weak.length? `${weak.length} 个` : '';
  const list=$('weakList'); list.innerHTML='';
  if(!weak.length){
    list.innerHTML = '<div class="weak-empty">没有错词，可以放心睡觉了 🌙</div>';
  }else{
    weak.forEach(d=>{
      const el=document.createElement('div');
      el.className='wi';
      el.innerHTML = `<span class="ww">${esc(d.w)}</span><span class="wz">${esc(d.z)}</span>`;
      el.onclick = ()=>speak(d.w);
      list.appendChild(el);
    });
  }

  $('btnAgain').innerHTML = weak.length? `再刷这 ${weak.length} 个` : '再来一轮';
  $('btnAgain').disabled = false;
  $('btnAgain').onclick = ()=>{ weak.length? startDeck(weak, '错词') : startDeck(DATA.filter(d=>d.c===S.deck[0]?.c), '重刷'); };

  DB.last = new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  clearSession();
  show('done');
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 语音 ---------- */
function speak(w){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w);
    u.lang='en-US'; u.rate=.92;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 交互绑定 ---------- */
$('btnAll').onclick = startAll;
$('btnWeak').onclick = startWeak;
$('btnResume').onclick = resumeSession;

function leaveStudy(){
  persistSession();
  if(DB.session && DB.session.i < DB.session.ids.length) toast('进度已保存，可随时继续');
  show('home'); renderHome();
}
$('btnQuit').onclick = leaveStudy;
$('btnHome').onclick = leaveStudy;

$('card').onclick = e=>{
  if(e.target.closest('.spk') || e.target.closest('.spk-mini')) return;
  if(S.stage==='front') flip();
};
$('btnSpk').onclick = e=>{ e.stopPropagation(); const d=S.deck[S.i]; if(d) speak(d.w); };
$('btnSpkFront').onclick = e=>{ e.stopPropagation(); const d=S.deck[S.i]; if(d) speak(d.w); };
$('btnNo').onclick = e=>{ e.stopPropagation(); judge('wrong'); };
$('btnYes').onclick = e=>{ e.stopPropagation(); judge('right'); };
$('btnUndo').onclick = e=>{ e.stopPropagation(); undo(); };

document.addEventListener('keydown', e=>{
  if(S.view!=='study') return;
  if(e.key==='ArrowRight' || e.key==='2' || e.key==='d'){ e.preventDefault(); judge('right'); }
  else if(e.key==='ArrowLeft' || e.key==='1' || e.key==='a'){ e.preventDefault(); judge('wrong'); }
  else if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); if(S.stage==='front') flip(); else next(); }
  else if(e.key==='ArrowUp' || e.key==='Backspace' || e.key==='z'){ e.preventDefault(); undo(); }
  else if(e.key==='Escape'){ leaveStudy(); }
});

/* 触摸滑动 */
let tx=0, ty=0, tt=0;
$('card').addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; tt=Date.now(); }, {passive:true});
$('card').addEventListener('touchend', e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-tx, dy=t.clientY-ty, dt=Date.now()-tt;
  if(dt<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6){
    if(dx>0) judge('right'); else judge('wrong');
  }
}, {passive:true});

/* 设置 */
$('btnGear').onclick = ()=>{ $('mask').hidden=false; };
$('mask').onclick = e=>{ if(e.target===$('mask')) $('mask').hidden=true; };
$('swShuffle').onclick = e=>{ e.stopPropagation(); DB.settings.shuffle=!DB.settings.shuffle; save(); renderHome(); };
$('swSkipL4').onclick = e=>{ e.stopPropagation(); DB.settings.skipL4=!DB.settings.skipL4; save(); renderHome(); };
$('swSpeak').onclick = e=>{ e.stopPropagation(); DB.settings.autoSpeak=!DB.settings.autoSpeak; save(); renderHome(); };
$('btnReset').onclick = ()=>{
  if(confirm('清空全部学习进度？此操作不可撤销。')){
    DB = JSON.parse(JSON.stringify(DEF));
    save(); $('mask').hidden=true; renderHome();
    toast('进度已清空');
  }
};

/* 启动 */
renderHome();
</script>
